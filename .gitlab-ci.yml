stages:
  - image_build
  - delivery-k8s

variables:
  GIT_DEPTH: 0
  STAGE_RUNNER_TAG: ewt2-gitrun01

before_script:
  - export TZ='Europe/Moscow'

image_build:
  stage: image_build
  image: sregistry.mts.ru/fintech/docker:latest
  tags:
    - ${STAGE_RUNNER_TAG}
  script:
    - set -x
    - if [ "$CI_COMMIT_BRANCH" == "master" ] ; then ENVIRONMENT=stage ; fi
    - if [ "$CI_COMMIT_BRANCH" == "production" ] ; then ENVIRONMENT=prod ; fi
    - BUILD_IMAGE_PATH=$( echo ${HARBOR}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME} | tr [:upper:] [:lower:] )
    - docker login --username="${REGISTRY_USER_FINTECH}" --password="${REGISTRY_PASSWORD_FINTECH}" ${HARBOR}
    - docker build --pull -t ${BUILD_IMAGE_PATH}/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHORT_SHA} .
    - docker push ${BUILD_IMAGE_PATH}/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHORT_SHA}


